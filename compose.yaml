services:

  db:
    image: postgres:16

    container_name: postgres-db

    environment:
      POSTGRES_DB: financial_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d ${DB_NAME:-financial_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .

    container_name: financial-transactions-app

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      DB_HOST: db
      DB_NAME: financial_db
      DB_USERNAME: admin
      DB_PASSWORD: 123

      JWT_SECRET: ${JWT_SECRET:-aktBOU5pcUlpZHd4WEVFZTJyUlVHS2xyeDYzc1BVSm5MZnRsN1lIbWY3VQ==}

volumes:
  postgres_data: